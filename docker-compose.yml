services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8080/api/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      # Internal Compose DNS; no browser or provider key is needed by this service.
      API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional, GPU-only local LLM server. It starts only with --profile vllm.
  # The API gateway uses the same OpenAI-compatible chat-completions protocol.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    command:
      - --model
      - ${VLLM_MODEL}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  huggingface_cache:
